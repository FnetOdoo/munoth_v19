[options]

; Database
admin_passwd = admin@123!
db_host = localhost
db_port = 5432
db_name = False
db_user = odoo19
db_password = admin
db_maxconn = 64
db_maxconn_gevent = 8
db_sslmode = prefer
db_template = template0

; HTTP server
http_port = 8019
http_enable = True
http_interface = 0.0.0.0
gevent_port = 8072

; Addons
addons_path = /home/odooadmin/munoth_v19/odoo/addons,/home/odooadmin/munoth_v19/addons,/home/odooadmin/munoth_v19/custom/enterprise_addons,/home/odooadmin/munoth_v19/custom/addons

; Data
data_dir = /home/odooadmin/.local/share/Odoo
csv_internal_sep = ,
demo = {}

; Email
email_from =
from_filter =
smtp_password =
smtp_port = 25
smtp_server = localhost
smtp_ssl = False
smtp_ssl_certificate_filename =
smtp_ssl_private_key_filename =
smtp_user =

; GeoIP
geoip_city_db =
geoip_country_db =

; Memory limits
limit_memory_hard = 2147483648
limit_memory_hard_gevent = 1342177280
limit_memory_soft = 1610612736
limit_memory_soft_gevent = 1073741824

; Request and time limits
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200
limit_time_real_cron = 1800

; Database list
list_db = True

; Logging
log_db = False
log_db_level = warning
log_handler = :WARNING,werkzeug:CRITICAL,odoo.sql_db:WARNING
log_level = warn
logfile =

; Cron
max_cron_threads = 2

; Memory
osv_memory_count_limit = 0

; PostgreSQL
pg_path = /usr/lib/postgresql/16/bin

; Reverse proxy
proxy_mode = False

; Reports and screenshots
reportgz = False
screencasts =
screenshots = /tmp/odoo_tests

; Server-wide modules
server_wide_modules = base,web

; System log
syslog = False

; Testing
test_enable = False
test_file =
test_tags = None

; Transient records
transient_age_limit = 1.0

; Text search
unaccent = True

; Upgrade
upgrade_path =

; Websocket
websocket_keep_alive_timeout = 3600
websocket_rate_limit_burst = 10
websocket_rate_limit_delay = 0.2

; Demo
without_demo = True

; Workers
workers = 4

; X-Sendfile
x_sendfile = False